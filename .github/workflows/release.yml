name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify release versions
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          SERVER_VERSION=$(jq -r '.version' server.json)
          PACKAGE_VERSION=$(jq -r '.packages[0].version' server.json)
          PROJECT_VERSION=$(sed -n -E 's|.*<Version>([^<]*)</Version>.*|\1|p' src/server/Sherlock.MCP.Server.csproj)
          PLUGIN_VERSION=$(jq -r '.version' plugins/sherlock/.claude-plugin/plugin.json)
          MARKETPLACE_VERSION=$(jq -r '.plugins[] | select(.name == "sherlock") | .version' .claude-plugin/marketplace.json)
          PLUGIN_DNX_VERSION=$(jq -r '.sherlock.args[0]' plugins/sherlock/.mcp.json | sed 's/.*@//')
          echo "Tag version: $VERSION"
          FAILED=0
          check() {
            echo "$1: $2"
            if [ "$2" != "$VERSION" ]; then
              echo "::error::$1 ($2) does not match tag version ($VERSION)."
              FAILED=1
            fi
          }
          check "server.json version" "$SERVER_VERSION"
          check "server.json packages[0].version" "$PACKAGE_VERSION"
          check "Sherlock.MCP.Server.csproj <Version>" "$PROJECT_VERSION"
          check "plugin.json version" "$PLUGIN_VERSION"
          check "marketplace.json sherlock version" "$MARKETPLACE_VERSION"
          check "plugin .mcp.json dnx version" "$PLUGIN_DNX_VERSION"
          if [ "$FAILED" -ne 0 ]; then
            echo "Please update server.json, the server project version and the Claude Code plugin versions before creating the release tag."
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore src/Sherlock.MCP.slnx

      - name: Build
        run: dotnet build src/Sherlock.MCP.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/Sherlock.MCP.slnx --configuration Release --no-restore --verbosity normal

      - name: Pack
        run: dotnet pack src/server/Sherlock.MCP.Server.csproj --configuration Release -o ./artifacts

      - name: Verify MCP server package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          PACKAGE=./artifacts/Sherlock.MCP.Server.$VERSION.nupkg
          if ! unzip -l "$PACKAGE" | grep -q '\.mcp/server\.json$'; then
            echo "::error::$PACKAGE does not contain .mcp/server.json."
            exit 1
          fi
          if ! unzip -p "$PACKAGE" '*.nuspec' | grep -q '<packageType name="McpServer"'; then
            echo "::error::$PACKAGE is not declared with the McpServer package type."
            exit 1
          fi
          if [ "$(unzip -p "$PACKAGE" .mcp/server.json | jq -r '.version')" != "$VERSION" ]; then
            echo "::error::Packed .mcp/server.json version does not match tag version ($VERSION)."
            exit 1
          fi

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Extract the section for this version from CHANGELOG.md
          CHANGELOG=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release v$VERSION"
          fi
          DELIMITER="NOTES_EOF_$(openssl rand -hex 16)"
          {
            echo "NOTES<<$DELIMITER"
            printf '%s\n' "$CHANGELOG"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.NOTES }}
          files: ./artifacts/*.nupkg
          generate_release_notes: false

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Wait for NuGet indexing
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          URL="https://api.nuget.org/v3-flatcontainer/sherlock.mcp.server/index.json"
          for i in $(seq 1 40); do
            if curl -fsSL "$URL" | grep -q "\"$VERSION\""; then
              echo "NuGet has indexed version $VERSION."
              exit 0
            fi
            echo "Version $VERSION not indexed yet (attempt $i/40); waiting 30s..."
            sleep 30
          done
          echo "::error::NuGet did not index version $VERSION within 20 minutes."
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
